[project]
name = "cds-downloader"
version = "0.1.0"
description = "Simple CLI for downloading ERA5-Land data from the Copernicus CDS API"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Réginal Exavier" }]
keywords = [
  "cds",
  "cdsapi",
  "copernicus",
  "era5",
  "era5-land",
  "climate",
  "cli",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = ["cdsapi>=0.7.7"]

[project.urls]
Homepage = "https://github.com/reginalexavier/cds-downloader"
Repository = "https://github.com/reginalexavier/cds-downloader"
Issues = "https://github.com/reginalexavier/cds-downloader/issues"

[project.scripts]
cds-downloader = "cds_downloader.cli:main"

[dependency-groups]
dev = ["pre-commit>=4.0", "pytest>=8.0", "ruff>=0.11.2", "taskipy>=1.14.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cds_downloader"]

[tool.ruff]
line-length = 120
src = ["cds_downloader", "tests"]

[tool.ruff.lint]
preview = true
select = ["I", "F", "E", "W", "PL", "PT"]

[tool.ruff.format]
preview = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers --durations=10"

[tool.taskipy.tasks]
lint = "ruff check"
pre_format = "ruff check --fix"
format = "ruff format"
test = "pytest -vv"
pci = "pre-commit install"
pcr = "pre-commit run --all-files"
pcu = "pre-commit autoupdate"
