[project]
name = "cds-downloader"
version = "0.1.0"
description = "Simple CLI for downloading ERA5-Land data from the Copernicus CDS API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["cdsapi>=0.7.7"]

[project.scripts]
cds-downloader = "cds_downloader.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.11.2", "taskipy>=1.14.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cds_downloader"]

[tool.ruff]
line-length = 88
src = ["cds_downloader", "tests"]

[tool.ruff.lint]
preview = true
select = ["I", "F", "E", "W", "PL", "PT"]

[tool.ruff.format]
preview = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers --durations=10"

[tool.taskipy.tasks]
lint = "ruff check"
pre_format = "ruff check --fix"
format = "ruff format"
test = "pytest -vv"
