[project]
name = "cds-downloader"
version = "0.1.0"
description = "Simple CLI for downloading ERA5-Land data from the Copernicus CDS API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cdsapi>=0.7.7",
]

[project.scripts]
cds-downloader = "cds_downloader.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cds_downloader"]
